name: pages

# The tier site on GitHub Pages: web/ (the page) with the committed tables as its
# data (`nikke web`). The page recomputes the tiers in the browser, so the site
# only has to be rebuilt when the data or the page changes - whenever main does.
#
# Pushes made with the workflow token do not start other workflows, and that is
# how main usually moves: the scheduled refresh commits the new data, and
# merge-to-main merges session work. So besides a push to main, this runs when
# either of those finishes (after refresh always - it commits what it collected
# even when it ends red - after merge-to-main only when it merged).
#
# Pages has to be switched on once by hand: Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions. Until then the site is still built (a
# broken page shows up here) but not published, and the run says so.

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: [refresh, merge-to-main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'refresh' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the site
        run: |
          pip install -q -e .
          nikke build raids
          nikke web --out _site

      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not publishing from Actions yet. Turn it on once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. The site was built but not published."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
