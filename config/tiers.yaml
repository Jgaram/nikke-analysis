# 티어 인자.
#
# 판단이 들어가는 값은 전부 여기 있다. 하나를 바꾸면 리뷰할 수 있는 diff 가 되고,
# `nikke analyze` 를 다시 돌리면 전 기간이 새 정의로 다시 계산된다.
# 숫자 하나하나의 뜻은 docs/metrics.md 에 있다.
#
# 재는 단위는 기여도(표의 열 이름은 lift)다. 상위 랭커의 대미지를 덱에 든 니케끼리 나눠
# 가진 몫으로, 한 사람이 쓰는 25명(5덱 × 5명)이 똑같이 나누면 모두 1.0 이다.
# (한 사람의 대미지를 다섯 덱에 각 덱이 낸 비율대로 나누고, 덱의 몫은 덱의 다섯 명이
# 똑같이 나눈다.)

# 어떤 랭킹을 셀까.
#
# 기본은 전 서버. GLOBAL·JP·KR·NA·SEA·TW-HK 는 게임 버전·보스·패치가 같아서, 서버마다의
# 상위 50명은 같은 메타를 한 번 더 본 것이다. 여기를 바꾸면 커밋되는 표가 바뀐다. 다른 표본을
# 한 번만 보려면 명령줄의 --server / --exclude 를 쓴다(그 실행에서만 아래 두 줄을 대신하고,
# 커밋되는 것은 건드리지 않는다). 서버 이름은 대소문자를 가리지 않고 한글도 된다
# (한국, 일본, 글로벌, 북미, 동남아, 대만).
population:
  top_n: 50              # 서버마다 1..N 위 (enikk 는 상위 50명까지 준다)
  servers: []            # 이 서버만. [] = 전 서버. 예: [KR] 이면 한국 서버만
  exclude_servers: []    # 이 서버만 빼고. 예: [NA, SEA]
  rank_weighting: dcg    # dcg: 순위가 높을수록 크게 친다, 1/log2(순위+1) 이라 1위 1.00 · 50위 0.18. uniform: 모두 같게

# 시즌 티어: 기여도에 대는 고정 컷, 높은 티어부터. 백분위가 아니라 고정값이라 시즌마다 SS
# 인원이 달라질 수 있다 - 그 자체가 정보다. 이 값이면 한 시즌에 SS 가 평균 약 4명(0~9명,
# 압도적인 메인 덱이 있으면 다섯), S 이상 약 8명, B 이상 약 22명이다. D 는 가끔 끼는 니케
# (한 시즌에 약 7명, 대개 상위 랭커 13% 남짓이 씀), F 는 거의 안 쓰이는 나머지(약 107명, 쓴다 해도 1%
# 남짓)다. 사이트의 티어표는 F 줄을 접어 둔다.
cuts:
  - { label: SS, min_lift: 1.4 }
  - { label: S,  min_lift: 1.1 }
  - { label: A,  min_lift: 0.8 }
  - { label: B,  min_lift: 0.5 }
  - { label: C,  min_lift: 0.2 }
  - { label: D,  min_lift: 0.03 }
  - { label: F,  min_lift: 0.0 }
# 속성 티어도 위 컷을 쓴다.

# 종합 티어의 컷: 이름은 같고 값만 낮다. 종합은 다섯 칸의 평균이라, 한 속성만 맡고 나머지에서
# 안 쓰이는 니케는 속성 기여도의 5분의 1이 된다 - 위 컷을 그대로 대면 속성 SS 인 속성 특화 니케(1.4)가
# 종합 C(0.28)다. 아래 값이면 시즌 16-41 전 시점에서 종합 티어마다 인원 비율이 속성 티어와 거의
# 같다(SS·S·A 가 속성 6% · 7% · 11%, 종합 6% · 6% · 10%). A 0.3 은 "한 속성에서만 SS 인 속성 특화 니케" 쯤이다. 순위는 종합
# 값 그대로이고 컷만 다르다. 라벨과 순서는 위 cuts 와 같아야 한다.
overall_cuts:
  - { label: SS, min_lift: 0.9 }
  - { label: S,  min_lift: 0.65 }
  - { label: A,  min_lift: 0.3 }
  - { label: B,  min_lift: 0.18 }
  - { label: C,  min_lift: 0.07 }
  - { label: D,  min_lift: 0.015 }
  - { label: F,  min_lift: 0.0 }

# 속성 티어와 종합 티어.
#
# 속성 티어: 자기 속성 안에서의 가치 - 보스 약점이 그 니케의 속성이던 시즌들의 기여도.
# 종합 티어: 속성 로테이션 전체에서의 가치 - 보스 약점 다섯 가지마다 기여도 평균을 따로 내고
# (내부 칸 다섯 개) 하나로 합친다. 칸은 니케의 속성이 아니라 보스의 약점을 따른다: 풍압 약점
# 시즌에 나오는 수냉 서포터는 종합을 거기서 벌고, 수냉 속성 티어는 낮은 채로 있다. 스킬로
# 속성이 더해지는 니케(data/manual/extra_elements.csv)는 두 속성 모두에서 속성 티어를 받는다
# (애장품으로 더해진 속성은 애장품을 낀 시즌에서만).
#
# 아직 못 겪은 약점 칸은 같은 쪽 기록으로만 채운다. 다른 속성 칸은 겪은 다른 속성 칸들의
# 평균이고, 다른 속성을 하나도 못 겪었으면 0 이다(자기 속성 시즌에만 쓰인 니케는 속성 특화로 본다 -
# 시즌 1-41 에서 그런 니케가 나중에 다른 속성에서 낸 값은 자기 속성 값의 중앙값 2%였다). 자기
# 속성 칸도 0 이다(자기 속성이 둘이면 겪은 쪽 값으로도 짐작하지 않는다). 속성 티어는 그 속성
# 시즌을 겪기 전까지 비어 있다.
element:
  # 이만큼 지난 시즌은 절반만 친다. 시즌 수가 아니라 날짜로 세는 이유: 같은 약점은 몇 달에
  # 한 번씩만 돌아오고 간격도 들쭉날쭉하다.
  half_life_days: 180
  # 칸을 그 니케의 전체 평균 쪽으로 당기는 가상 시즌 수. 0 = 겪은 시즌을 그대로 믿는다.
  # 양수면 한 번만 본 칸의 우연을 줄이지만, 속성 특화 니케의 주력 속성까지 (낮은) 전체 평균 쪽으로
  # 끌어내리므로 기본은 꺼 둔다.
  prior_strength: 0
  # 다섯 칸을 한 숫자로:
  #   mean      - 속성마다 똑같이. 최근 어떤 약점이 몰렸는지에 흔들리지 않는다 (기본)
  #   frequency - 최근 보스 약점으로 자주 나온 속성일수록 크게
  #   max       - 가장 잘한 속성만
  overall: mean
  # 겪은 보스 약점이 이보다 적거나 자기 속성 시즌을 아직 못 겪었으면 종합이 잠정(*)이다.
  # 못 겪은 칸은 채워 넣은 값이기 때문이다.
  min_elements_observed: 3
  # 진행 중인 시즌도 지금까지 수집한 순위로 속성·종합 티어에 넣는다(잠정, 수집할 때마다
  # 바뀐다). false 면 끝난 시즌만 센다.
  include_live: true

# 수명: 니케가 언제부터 쓰였고, 몇 시즌이나 쓰였고, 아직 쓰이는지. 티어에는 들어가지 않는다.
lifespan:
  # 그 시즌의 시즌 티어가 이 티어 이상이면 "쓰인 시즌"으로 친다. D = 기여도 0.03 이상 - 대개 상위 랭커
  # 열 명에 한 명 남짓이 쓴 시즌이다(예전 기준 "사용률 10% 이상"과 시즌 98%가 같게 갈린다). 은퇴는
  # "쓰이고 있나"라는 상태라서, 그 시즌을 그대로 재는 시즌 티어로 본다. 속성·종합 티어는 지난 시즌을
  # 기억해서(반감기) 은퇴 판정에 쓰면 1년 넘게 늦다 - docs/lifecycle.md 1절.
  min_tier: D
  # 은퇴: 마지막으로 쓰인 시즌이 끝나고 retire_after_days 가 지났고, 그 사이 자기 속성이 약점인
  # 시즌이 retire_after_own_seasons 번 이상 지나가도록 안 쓰임. 그 뒤 다시 쓰이면 복귀. 곧 "3개월 넘게,
  # 그 사이 온 자기 속성 시즌까지 시즌 티어 F".
  #
  # 날짜만으로는 안 쓰이게 된 니케와 자기 속성 시즌을 기다리는 속성 특화 니케를 가르지 못한다.
  # 같은 약점은 몇 달에 한 번, 길면 1년 만에 돌아와서(철갑 시즌 14 → 26) 날짜를 1년으로 잡아야
  # 속성 특화 니케가 은퇴로 잡히지 않는데, 그러면 어디서나 쓰이다 안 쓰이게 된 니케가 1년 가까이
  # 현역으로 남는다. 그래서 날짜는 짧게 두고, 자기 속성 시즌이 한 번 와서 지나갔는데도 안 쓰였을
  # 때만 은퇴로 본다. 속성 시즌이 안 오면 아무리 길어도 현역이다.
  # retire_after_own_seasons 를 0 으로 두면 날짜만 본다.
  retire_after_days: 90
  retire_after_own_seasons: 1

# 범용도: 보스 약점이 자기 속성이 아닐 때도 얼마나 쓰이나. 티어에는 들어가지 않는다.
career:
  # 범용도 = 2X / (O + X). 최근 한 바퀴로 잰다: O = 가장 최근 자기 속성 시즌의 기여도(자기 속성 시즌이
  # 연달아 왔으면 그 평균), X = 그 앞 자기 속성 시즌 뒤로의 다른 속성 시즌 기여도 평균 - 최근 자기 속성
  # 시즌을 사이에 둔 로테이션 한 바퀴쯤. 티어의 반감기는 쓰지 않는다: 다른 속성 덱에서 빠진 니케가 반감기
  # 때문에 1년 넘게 범용으로 남았다(docs/lifecycle.md 2절). 0 = 약점이 자기 속성일 때만 쓰임, 1 = 약점과
  # 무관(X = O), 2 = 약점이 다른 속성일 때만 쓰임(O = 0, 예: 델타 : 닌자 시프).
  # 이 두 값(0~2)으로 띠를 나눈다: 속성 특화 < 0.3 <= 속성 위주 < 0.7 <= 범용.
  generality_bands: [0.3, 0.7]
  # 생애 곡선: 니케의 생애를 로테이션 한 바퀴씩(자기 속성 시즌 하나와 그 뒤 다른 속성 시즌들) 보고 모양으로
  # 나눈다 - 안 쓰임 · 처음부터 속성 특화 · 범용 → 속성 특화 · 범용인 채로 저묾 · 아직 범용. 역할이 아니라
  # 쓰임의 모양이다. 한 바퀴의 자기 속성 기여도나 다른 속성 기여도 평균이 이 시즌 티어 이상이면 그 바퀴에
  # 쓰인 것으로 본다(곡선의 "안 쓰임"과 "좁아짐"의 기준).
  curve_min_tier: C
  # 전성기의 범용도가 이 값 이상이면 "처음부터 범용"이다. 두 띠 경계의 가운데로 고른 값이다 - 전성기
  # 범용도는 0 근처와 0.7 이상에 많지만 그 사이에도 고르게 있어서 분포의 골이 없다. 내려오며 범용도가
  # 위 띠의 아래 값(0.3) 밑으로 가면 "범용 → 속성 특화", 안 가고 내려오면 "범용인 채로 저묾".
  curve_wide: 0.5

# 메타 변화: 시즌마다 쓰인 니케가 약점을 얼마나 따르나. 티어에는 들어가지 않는다.
meta:
  # 시즌마다 그 시즌 시작까지 이만큼 거슬러 열린 시즌들로, 쓰인 니케(자기 속성이나 다른 속성 기여도 평균이
  # 위 curve_min_tier 이상)를 그 기간의 범용도 띠로 센다. 같은 약점이 돌아오는 데 길면 1년이 걸려서 1년이면
  # 모든 약점이 들어간다. 짧게 잡으면 빨리 보이지만 자기 속성 시즌이 없는 니케가 빠진다.
  window_days: 365

# 티어와 같이 내는 숫자. 티어에는 들어가지 않는다.
diagnostics:
  deck_effect_ridge: 20      # 같은 사람의 덱끼리 비교하는 회귀의 릿지 세기
  synergy_min_decks: 20      # 한 시즌에 이만큼 이상 같은 덱에 든 쌍만 시너지로 센다
