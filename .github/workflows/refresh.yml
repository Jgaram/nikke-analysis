name: refresh

# The project's point is that a new patch, a new unit or a new Solo Raid season
# - and a season suspended or reopened mid-way - is picked up by running code,
# not by anyone interpreting a notice. This workflow is what makes that literal:
# it runs the same `nikke refresh` a developer would run, and commits the notice
# snapshots and the rebuilt tables.
#
# It also solves a practical problem. Cloud dev sessions may run behind a
# network allowlist that does not include the notice APIs or the ranking site.
# GitHub Actions runners have open egress, so this is where the fetching lives.

on:
  schedule:
    # Monday and Thursday, 06:00 UTC (15:00 KST): update notices go up early in
    # the week and updates land on Thursday mornings KST, so both a new notice
    # and the maintenance that follows it are caught within a few days.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons whose rankings to re-read even if unchanged (space separated). Empty = only new or changed seasons."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          # A Hangul font so the charts can name units in Korean.
          sudo apt-get install -y --no-install-recommends fonts-nanum > /dev/null
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # A source that cannot be collected, or a result the rules could not
      # make sense of, makes `nikke refresh` exit 1. The run still commits what
      # it did collect, and only then fails - so the run shows red (and GitHub notifies), and
      # nothing half-read is mistaken for a quiet week.
      - name: Refresh
        id: refresh
        continue-on-error: true
        run: nikke -v refresh --seasons ${{ inputs.seasons }}

      - name: Commit notice snapshots and rebuilt tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/raw is ignored except for what cannot be re-fetched reliably:
          # the notices every date is derived from, enikk's season record and
          # Solo Raid ranking snapshots. Collection is incremental: a quiet
          # week adds nothing, a week with a season running adds that season's
          # newest rankings.
          git add data/processed data/manual data/raw
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: refresh notices, rankings, tiers and Solo Raid calendar"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## 상태 점검'
            echo '```'
            nikke check || true
            echo '```'
            echo '## 티어'
            echo '```'
            nikke tier || true
            echo '```'
            echo '## 솔로 레이드 시즌'
            echo '```'
            nikke seasons
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: reports/
          if-no-files-found: ignore

      - name: Fail when the refresh needs a human
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "nikke refresh reported a collection failure or a timeline error; see the summary."
          exit 1
