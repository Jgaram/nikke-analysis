# Tier parameters.
#
# Every judgement call in the analysis lives here, so changing one is a
# reviewable diff and re-running (`nikke analyze`) reproduces the whole history
# under the new definition. docs/metrics.md explains each number.
#
# The unit of measurement is LIFT: a unit's share of the top players' damage,
# scaled so that 1.0 is what an average member of a player's 25 units carries.
# (Each player's damage is split over their five decks by each deck's share,
# and a deck's share equally over its five members.)

# Which leaderboard entries count.
#
# Every server by default: GLOBAL, JP, KR, NA, SEA and TW-HK run the same game
# version, boss and patches, so each server's top 50 is another look at the same
# meta. Narrow it here to change the committed tables; for one look at another
# sample, use --server / --exclude on the command line instead (it replaces
# these two lines for that run and writes nothing that is committed). Names take
# any case and Korean (한국, 일본, 글로벌, 북미, 동남아, 대만).
population:
  top_n: 50              # ranks 1..N of every server (enikk serves the top 50)
  servers: []            # only these; [] = every server. e.g. [KR] for the Korean server alone
  exclude_servers: []    # every server but these, e.g. [NA, SEA]
  rank_weighting: dcg    # dcg: 1/log2(rank+1), so rank 1 = 1.00, rank 50 = 0.18; or uniform

# Season tier: fixed cuts on lift, best to worst. Fixed rather than percentile,
# so the number of SS units can differ from season to season - that is information.
# With these values a season has on average ~4 SS (0-9: a dominant main deck
# gives five), ~8 S-or-better and ~22 B-or-better units.
cuts:
  - { label: SS, min_lift: 1.4 }
  - { label: S,  min_lift: 1.1 }
  - { label: A,  min_lift: 0.8 }
  - { label: B,  min_lift: 0.5 }
  - { label: C,  min_lift: 0.2 }
  - { label: D,  min_lift: 0.0 }

# Element and overall tiers.
#
# Element tier: what a unit is worth in its own element - its lift in the
# seasons whose boss was weak to that element. Overall tier: what it is worth
# over the whole rotation - its lift estimated per boss weakness (five slots,
# kept internal) and combined into one number. The slots follow the boss's
# weakness, not the unit's element: a Water support fielded in Wind-weak seasons
# earns its overall there, while its Water tier stays low. A unit whose skill
# adds an element (data/manual/extra_elements.csv) has an element tier in each.
element:
  # A season this many days before the moment of the view counts half as much.
  # Days rather than seasons, because each element comes around only every few
  # months and the gaps are uneven.
  half_life_days: 180
  # Pseudo-seasons that pull a slot toward the unit's all-element level.
  # 0 = trust the observed seasons as they are. A positive value damps a slot
  # seen only once, but it also drags a specialist's own element toward its
  # (low) all-element average, so it is off by default. A slot with no season
  # at all since release takes the all-element level in the overall; the
  # element tier stays empty until the unit meets a season of its element.
  prior_strength: 0
  # One number from the five slots:
  #   mean      - equal weight per element; does not depend on which elements
  #               came up lately (default)
  #   frequency - weight each element by how often (recently) bosses were weak to it
  #   max       - the best element only
  overall: mean
  # Seen in fewer boss weaknesses than this: the overall tier is provisional,
  # because the unseen slots borrow the level of the few that were seen.
  min_elements_observed: 3

# Numbers reported alongside the tiers, not part of them.
diagnostics:
  deck_effect_ridge: 20      # ridge penalty of the within-player deck regression
  synergy_min_decks: 20      # a pair must share at least this many decks in a season
