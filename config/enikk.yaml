# enikk Solo Raid rankings.
#
# enikk (https://enikk.app/soloraid) serves everything through one GraphQL
# endpoint, POST /api/graphql. `nikke collect enikk` sends the query below once
# per season and stores the response untouched under data/raw/enikk_soloraid/;
# `nikke build raids` reads it back with the field map. If the site renames a
# field, fix it here and re-run the build - every stored season re-parses.
#
# See docs/enikk-setup.md.

base_url: https://enikk.app

# Seconds between requests. enikk is run by one person; do not lower this.
delay: 1.5

rankings:
  # Top 50 of every server (GLOBAL, JP, KR, NA, SEA, TW-HK), each with five
  # decks: the five units, the deck's damage, and per-unit combat power and
  # core level. Passing `all: true` would add players outside the top 50 whom
  # enikk happened to look up - not a defined population, so it is left off.
  query: >-
    query SoloRaidRankings($raid: Float!) { SRRankings(raid: $raid)
    { rank playerid server damage cp collectionTime firstAppeared teams } }

  # Where each field sits in the response. Dotted paths; "[]" walks a list.
  mapping:
    entries: data.SRRankings[]   # one record per ranked player
    rank: rank                   # 1-50 within the server
    score: damage                # the player's total: the sum of the five decks
    player: playerid
    server: server
    collected_at: collectionTime # when enikk last saw this record
    decks: teams[]               # the five decks
    deck_score: damage           # one deck's damage
    deck_units: characters       # five unit names, in slot order
    deck_unit_cp: cpc            # combat power per slot
    deck_unit_cores: cores       # core level per slot
